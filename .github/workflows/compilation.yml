name: CI

on:
  push:
  pull_request:
  repository_dispatch:
    types: [run_build]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ${{ matrix.os }}
    strategy:
      matrix:
        os: [alpine:latest, fedora:latest, debian:latest]
      fail-fast: false

    steps:
    - name: Install Debian build dependencies
      if: startsWith(matrix.os, 'debian')
      run: |
        apt-get update
        apt-get install -y wget adduser build-essential meson ninja-build makepkg pkgconf curl libcurl4 libcurl4-openssl-dev libssl-dev libarchive-tools libarchive-dev libgpgme-dev git sudo
        adduser --system --group build

    - name: Install Alpine build dependencies
      if: startsWith(matrix.os, 'alpine')
      run: |
        apk add wget wget build-base bash meson ninja-build pacman pkgconfig libarchive-tools libarchive-dev openssl-dev gpgme-dev curl-dev git sudo fakeroot curl
        adduser -D -s /bin/bash build

    - name: Install Fedora build dependencies
      if: startsWith(matrix.os, 'fedora')
      run: |
        dnf -y install gcc meson ninja-build makepkg wget bsdtar libarchive-devel openssl-devel gpgme-devel libcurl-devel pkgconf git patch sudo which fakeroot curl
        useradd build

    - uses: actions/checkout@v6

    - name: Compile psp-pacman
      run: |
        export PSPDEV=$PWD/pspdev
        export PATH="$PATH:$PSPDEV/bin"
        chown -R build:build .
        sudo -u build PATH="${PATH}" PSPDEV="${PSPDEV}" ./build-and-install.sh
        psp-pacman -V

    - name: Create archive
      run: |
        tar -czvf pspdev.tar.gz pspdev

    - name: Create repo files
      run: |
        export PSPDEV=${PWD}/pspdev
        ${PSPDEV}/share/pacman/bin/repo-add psp-pacman.db.tar.gz *.pkg.tar.gz
        mv psp-pacman.db.tar.gz psp-pacman.db
        mv psp-pacman.files.tar.gz psp-pacman.files

    - name: Set ARCH variable
      run: |
        ARCH="$(./get-arch)"
        echo "ARCH=${ARCH}" >> $GITHUB_ENV

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ARCH }}
        path: |
          psp-pacman-*.pkg.tar.gz
          pspdev.tar.gz
          psp-pacman.db
          psp-pacman.files


  build-VM:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
      fail-fast: false

    steps:
    - uses: actions/checkout@v6

    - name: Install Ubuntu build dependencies
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update
        sudo apt-get -y install meson libcurl4-openssl-dev libarchive-tools libarchive-dev libgpgme-dev

    - name: Install Mac build dependencies
      if: startsWith(matrix.os, 'macos')
      run: |
        brew install bash meson gnu-sed libarchive gpgme

    - name: Compile psp-pacman
      run: |
        export PSPDEV=$PWD/pspdev
        export PATH="$PATH:$PSPDEV/bin"
        sudo PATH="${PATH}" PSPDEV="${PSPDEV}" ./build-and-install.sh
        psp-pacman -V

    - name: Create archive
      run: |
        tar -czvf pspdev.tar.gz pspdev

    - name: Create repo files
      run: |
        export PSPDEV=${PWD}/pspdev
        ${PSPDEV}/share/pacman/bin/repo-add psp-pacman.db.tar.gz *.pkg.tar.gz
        mv psp-pacman.db.tar.gz psp-pacman.db
        mv psp-pacman.files.tar.gz psp-pacman.files

    - name: Set ARCH variable
      run: |
        ARCH="$(./get-arch)"
        echo "ARCH=${ARCH}" >> $GITHUB_ENV

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ARCH }}
        path: |
          psp-pacman-*.pkg.tar.gz
          pspdev.tar.gz
          psp-pacman.db
          psp-pacman.files


  package-repo:
    if: contains(github.ref,'refs/heads/master')
    needs: [build, build-VM]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        path: repo/

    - name: Copy index files
      run: |
        cp site/* repo/
        cp get-arch repo/

    - name: Upload repo artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: repo/


  publish-repo:
    if: contains(github.ref,'refs/heads/master')
    needs: [package-repo]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5


  dispatch:
    if: contains(github.ref,'refs/heads/master')
    needs: [publish-repo]
    runs-on: ubuntu-latest
  
    steps:
    - name: Send Compile action
      run: |
        export DISPATCH_ACTION="$(echo run_build)"
        echo "NEW_DISPATCH_ACTION=$DISPATCH_ACTION" >> $GITHUB_ENV
    - name: Repository Dispatch to psptoolchain-extra
      uses: peter-evans/repository-dispatch@v4
      with:
        repository: ${{ github.repository_owner }}/psptoolchain-extra
        token: ${{ secrets.DISPATCH_TOKEN }}
        event-type: ${{ env.NEW_DISPATCH_ACTION }}
        client-payload: '{"ref": "${{ github.ref }}"}'
